
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora do Efeito Doppler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Efeito Doppler</h1>
        <p class="descricao">
            Calcule a frequência percebida pelo observador.
        </p>

        <form id="dopplerForm">
            <div class="campo">
                <label for="velObservador">
                    1. Velocidade do observador (m/s)
                </label>
                <input type="number" id="velObservador"
                       value="0" step="any" required>
                <small>Positivo ao se aproximar da fonte.</small>
            </div>

            <div class="campo">
                <label for="velFonte">
                    2. Velocidade da fonte (m/s)
                </label>
                <input type="number" id="velFonte"
                       value="0" step="any" required>
                <small>Positivo ao se aproximar do observador.</small>
            </div>

            <div class="campo">
                <label for="velSom">
                    3. Velocidade do som (m/s)
                </label>
                <input type="number" id="velSom"
                       value="343" min="0.01" step="any" required>
            </div>

            <div class="campo">
                <label for="freqFonte">
                    4. Frequência emitida pela fonte (Hz)
                </label>
                <input type="number" id="freqFonte"
                       value="440" min="0.01" step="any" required>
            </div>

            <button type="submit">Calcular frequência</button>
            <button type="reset" class="secundario">Limpar</button>
        </form>

        <section id="resultado" aria-live="polite" hidden>
            <h2>Resultado</h2>
            <p>Frequência percebida:</p>
            <strong id="frequenciaCalculada">0 Hz</strong>
            <p id="interpretacao"></p>
        </section>

        <p id="erro" role="alert"></p>
    </main>

    <script src="script.js"></script>
</body>
